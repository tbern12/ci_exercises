name: Docstrings Workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  docstrings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: set up python 3.13
        uses: actions/setup-python@v7
        with: 
          python-version: "3.13
      - name: Install Dependencies
        run: |
          python -m pip install .[dev]
      - name: check that everything public has a docstring
        run: |
          ruff check --select D src/
        

