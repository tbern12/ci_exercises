name: os versions

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  os-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with: 
          python-version: "3.13"

      - name: Install Depenencies
        run: |
          python -m pip install .[dev]

      - name: lint with ruff
        run: |
          ruff check .

      - name: test with pytest
        run: |
          pytest
     
      
    
